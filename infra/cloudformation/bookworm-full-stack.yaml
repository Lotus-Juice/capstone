AWSTemplateFormatVersion: '2010-09-09'
Description: 'Bookworm Platform: Complete All-in-One Production CloudFormation Stack (VPC, ECR, KMS, Secrets, Multi-AZ RDS PostgreSQL 16, App Runner, IAM, CloudWatch Alarms).'

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: 'Environment & General Configuration'
        Parameters:
          - Environment
          - ApplicationName
      - Label:
          default: 'Compute & Container Configuration (AWS App Runner)'
        Parameters:
          - ImageUri
          - CpuSize
          - MemorySize
          - MinInstances
          - MaxInstances
          - MaxConcurrency
      - Label:
          default: 'Database Configuration (Amazon RDS PostgreSQL 16)'
        Parameters:
          - DBInstanceClass
          - AllocatedStorageGB
          - MaxAllocatedStorageGB
          - DatabaseUsername
      - Label:
          default: 'Operations & SRE Alerting'
        Parameters:
          - AlertEmail

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: 'Target environment name.'

  ApplicationName:
    Type: String
    Default: bookworm
    Description: 'Standard application prefix.'

  ImageUri:
    Type: String
    Default: 'public.ecr.aws/docker/library/busybox:latest'
    Description: 'Full ECR Image URI to run on App Runner.'

  CpuSize:
    Type: String
    Default: '2 vCPU'
    AllowedValues:
      - '0.25 vCPU'
      - '0.5 vCPU'
      - '1 vCPU'
      - '2 vCPU'
      - '4 vCPU'
    Description: 'vCPU per App Runner instance.'

  MemorySize:
    Type: String
    Default: '4 GB'
    AllowedValues:
      - '0.5 GB'
      - '1 GB'
      - '2 GB'
      - '3 GB'
      - '4 GB'
      - '6 GB'
      - '8 GB'
      - '10 GB'
      - '12 GB'
    Description: 'Memory per App Runner instance.'

  MinInstances:
    Type: Number
    Default: 2
    MinValue: 1
    MaxValue: 10
    Description: 'Minimum provisioned container instances.'

  MaxInstances:
    Type: Number
    Default: 25
    MinValue: 2
    MaxValue: 100
    Description: 'Maximum container instances for auto-scaling.'

  MaxConcurrency:
    Type: Number
    Default: 80
    MinValue: 1
    MaxValue: 200
    Description: 'Concurrent requests per instance before scaling.'

  DBInstanceClass:
    Type: String
    Default: db.r6g.large
    Description: 'RDS instance class (e.g. db.t4g.medium for dev, db.r6g.large for prod).'

  AllocatedStorageGB:
    Type: Number
    Default: 100
    MinValue: 20
    MaxValue: 1000
    Description: 'Initial GP3 storage for PostgreSQL in GB.'

  MaxAllocatedStorageGB:
    Type: Number
    Default: 500
    MinValue: 100
    MaxValue: 5000
    Description: 'Maximum auto-scaling storage limit for PostgreSQL in GB.'

  DatabaseUsername:
    Type: String
    Default: bookworm_admin
    Description: 'Master database username.'

  AlertEmail:
    Type: String
    Default: sre-alerts@bookworm.example.com
    Description: 'Email address for critical CloudWatch alarms.'

Conditions:
  IsProduction: !Equals [!Ref Environment, 'prod']

Resources:
  # ============================================================================
  # 1. NETWORKING TIER (VPC, Subnets, Route Tables, Internet Gateway)
  # ============================================================================
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-vpc'
        - Key: Environment
          Value: !Ref Environment

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Private Application Subnets (App Runner VPC Connector)
  AppSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-app-subnet-a'

  AppSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-app-subnet-b'

  # Isolated Database Subnets (RDS PostgreSQL)
  DBSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.20.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-db-subnet-a'

  DBSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.21.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-db-subnet-b'

  # ============================================================================
  # 2. SECURITY, KMS & SECRETS TIER
  # ============================================================================
  KmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'KMS CMK for ${ApplicationName} ${Environment}'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Id: bookworm-key-policy
        Statement:
          - Sid: EnableRootPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowAwsServices
            Effect: Allow
            Principal:
              Service:
                - !Sub 'secretsmanager.${AWS::URLSuffix}'
                - !Sub 'logs.${AWS::Region}.${AWS::URLSuffix}'
                - !Sub 'rds.${AWS::URLSuffix}'
                - !Sub 'apprunner.${AWS::URLSuffix}'
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
            Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment

  KmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${ApplicationName}-${Environment}-key'
      TargetKeyId: !Ref KmsKey

  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '/${ApplicationName}/${Environment}/credentials'
      Description: !Sub 'Database and signing credentials for ${ApplicationName} (${Environment})'
      KmsKeyId: !Ref KmsKey
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${DatabaseUsername}", "dbname": "bookworm", "port": 5432, "jwt_secret": "bookwormEnterpriseSecretKeyMustBeAtLeast256BitsLongForHMACSHA256!", "payment_webhook_secret": "whsec_prod_key_2025"}'
        GenerateStringKey: 'password'
        PasswordLength: 32
        ExcludeCharacters: '"/@\ '
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # 3. ECR CONTAINER REPOSITORY
  # ============================================================================
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub '${ApplicationName}-backend-${Environment}'
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt KmsKey.Arn
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Retain last 30 release images",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["v", "release", "prod", "main"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 30
                },
                "action": {
                  "type": "expire"
                }
              },
              {
                "rulePriority": 2,
                "description": "Expire untagged images older than 7 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 7
                },
                "action": {
                  "type": "expire"
                }
              }
            ]
          }
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # 4. IAM ROLES (LEAST-PRIVILEGE FOR APP RUNNER)
  # ============================================================================
  AppRunnerECRAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ApplicationName}-${Environment}-apprunner-ecr-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - build.apprunner.amazonaws.com
                - tasks.apprunner.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess'

  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ApplicationName}-${Environment}-apprunner-instance-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: AppRunnerRuntimePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SecretsManagerRead
                Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                  - 'secretsmanager:DescribeSecret'
                Resource: !Ref AppSecrets
              - Sid: KmsDecrypt
                Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:DescribeKey'
                Resource: !GetAtt KmsKey.Arn
              - Sid: XRayTracing
                Effect: Allow
                Action:
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                  - 'xray:GetSamplingRules'
                  - 'xray:GetSamplingTargets'
                Resource: '*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogStreams'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apprunner/${ApplicationName}-${Environment}*:*'

  # ============================================================================
  # 5. SECURITY GROUPS (APP RUNNER EGRESS & RDS INGRESS)
  # ============================================================================
  AppRunnerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security group for ${ApplicationName} App Runner Egress (${Environment})'
      VpcId: !Ref VPC
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16
          Description: 'Allow PostgreSQL access within VPC'
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: 'Allow outbound HTTPS'
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-apprunner-sg'

  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub 'Security group for ${ApplicationName} RDS PostgreSQL (${Environment})'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !GetAtt AppRunnerSecurityGroup.GroupId
          Description: 'Allow PostgreSQL from App Runner only'
      Tags:
        - Key: Name
          Value: !Sub '${ApplicationName}-${Environment}-rds-sg'

  # ============================================================================
  # 6. DATABASE TIER (RDS POSTGRESQL 16 MULTI-AZ)
  # ============================================================================
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub '${ApplicationName}-${Environment}-db-subnet-group'
      DBSubnetGroupDescription: !Sub 'DB subnet group for ${ApplicationName} (${Environment})'
      SubnetIds:
        - !Ref DBSubnetA
        - !Ref DBSubnetB

  DBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    Properties:
      Family: postgres16
      Description: 'PostgreSQL 16 Parameter Group enforcing TLS 1.3'
      Parameters:
        rds.force_ssl: '1'
        log_connections: '1'
        log_disconnections: '1'
        log_min_duration_statement: '1000'

  DatabaseInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBInstanceIdentifier: !Sub '${ApplicationName}-${Environment}-db'
      Engine: postgres
      EngineVersion: '16.4'
      DBInstanceClass: !Ref DBInstanceClass
      MultiAZ: !If [IsProduction, true, false]
      AllocatedStorage: !Ref AllocatedStorageGB
      MaxAllocatedStorage: !Ref MaxAllocatedStorageGB
      StorageType: gp3
      StorageEncrypted: true
      KmsKeyId: !GetAtt KmsKey.Arn
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DBSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      DBParameterGroupName: !Ref DBParameterGroup
      DBName: bookworm
      MasterUsername: '{{resolve:secretsmanager:' !Sub '${AppSecrets}:SecretString:username}}'
      MasterUserPassword: '{{resolve:secretsmanager:' !Sub '${AppSecrets}:SecretString:password}}'
      BackupRetentionPeriod: !If [IsProduction, 30, 7]
      EnablePerformanceInsights: true
      PerformanceInsightsKMSKeyId: !GetAtt KmsKey.Arn
      DeletionProtection: !If [IsProduction, true, false]
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # 7. APP RUNNER COMPUTE TIER (VPC CONNECTOR & SERVICE)
  # ============================================================================
  AppRunnerVpcConnector:
    Type: AWS::AppRunner::VpcConnector
    Properties:
      VpcConnectorName: !Sub '${ApplicationName}-${Environment}-vpc-connector'
      Subnets:
        - !Ref AppSubnetA
        - !Ref AppSubnetB
      SecurityGroups:
        - !GetAtt AppRunnerSecurityGroup.GroupId

  AppRunnerAutoScalingConfig:
    Type: AWS::AppRunner::AutoScalingConfiguration
    Properties:
      AutoScalingConfigurationName: !Sub '${ApplicationName}-${Environment}-autoscaling'
      MinSize: !Ref MinInstances
      MaxSize: !Ref MaxInstances
      MaxConcurrency: !Ref MaxConcurrency

  AppRunnerService:
    Type: AWS::AppRunner::Service
    DependsOn: DatabaseInstance
    Properties:
      ServiceName: !Sub '${ApplicationName}-${Environment}-api'
      SourceConfiguration:
        AutoDeploymentsEnabled: true
        AuthenticationConfiguration:
          AccessRoleArn: !GetAtt AppRunnerECRAccessRole.Arn
        ImageRepository:
          ImageIdentifier: !Ref ImageUri
          ImageRepositoryType: ECR
          ImageConfiguration:
            Port: '8080'
            RuntimeEnvironmentVariables:
              - Name: SPRING_PROFILES_ACTIVE
                Value: !Ref Environment
              - Name: SPRING_DATASOURCE_URL
                Value: !Sub 'jdbc:postgresql://${DatabaseInstance.Endpoint.Address}:${DatabaseInstance.Endpoint.Port}/bookworm?sslmode=require'
              - Name: SPRING_DATASOURCE_USERNAME
                Value: '{{resolve:secretsmanager:' !Sub '${AppSecrets}:SecretString:username}}'
              - Name: SPRING_JPA_HIBERNATE_DDL_AUTO
                Value: validate
              - Name: SERVER_PORT
                Value: '8080'
            RuntimeEnvironmentSecrets:
              - Name: SPRING_DATASOURCE_PASSWORD
                Value: !Sub '${AppSecrets}:password::'
              - Name: JWT_SECRET
                Value: !Sub '${AppSecrets}:jwt_secret::'
              - Name: PAYMENT_WEBHOOK_SECRET
                Value: !Sub '${AppSecrets}:payment_webhook_secret::'
      InstanceConfiguration:
        Cpu: !Ref CpuSize
        Memory: !Ref MemorySize
        InstanceRoleArn: !GetAtt AppRunnerInstanceRole.Arn
      HealthCheckConfiguration:
        Protocol: HTTP
        Path: /actuator/health
        Interval: 10
        Timeout: 5
        HealthyThreshold: 1
        UnhealthyThreshold: 3
      NetworkConfiguration:
        EgressConfiguration:
          EgressType: VPC
          VpcConnectorArn: !GetAtt AppRunnerVpcConnector.VpcConnectorArn
      AutoScalingConfigurationArn: !GetAtt AppRunnerAutoScalingConfig.AutoScalingConfigurationArn
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # ============================================================================
  # 8. OBSERVABILITY TIER (CLOUDWATCH LOG GROUP, ALARMS & SNS)
  # ============================================================================
  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apprunner/${ApplicationName}-${Environment}-api/application'
      RetentionInDays: !If [IsProduction, 90, 14]
      KmsKeyId: !GetAtt KmsKey.Arn

  AlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub '${ApplicationName}-${Environment}-sre-alerts'
      KmsMasterKeyId: !GetAtt KmsKey.Arn
      Subscription:
        - Protocol: email
          Endpoint: !Ref AlertEmail

  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ApplicationName}-${Environment}-high-cpu'
      AlarmDescription: 'App Runner CPU utilization > 80% for 5 mins'
      Namespace: AWS/AppRunner
      MetricName: CPUUtilization
      Dimensions:
        - Name: ServiceName
          Value: !Sub '${ApplicationName}-${Environment}-api'
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 80
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlertsTopic

  High5xxErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${ApplicationName}-${Environment}-high-5xx-errors'
      AlarmDescription: 'HTTP 5xx responses >= 5 within 2 consecutive 1-minute periods'
      Namespace: AWS/AppRunner
      MetricName: 5xxStatusResponses
      Dimensions:
        - Name: ServiceName
          Value: !Sub '${ApplicationName}-${Environment}-api'
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlertsTopic

Outputs:
  ServiceUrl:
    Description: 'Public HTTPS Endpoint for Bookworm REST API'
    Value: !Sub 'https://${AppRunnerService.ServiceUrl}'

  EcrRepositoryUri:
    Description: 'ECR Repository URI to push container images'
    Value: !GetAtt EcrRepository.RepositoryUri

  DatabaseEndpoint:
    Description: 'RDS PostgreSQL connection endpoint'
    Value: !GetAtt DatabaseInstance.Endpoint.Address

  SecretsArn:
    Description: 'AWS Secrets Manager Secret ARN'
    Value: !Ref AppSecrets
