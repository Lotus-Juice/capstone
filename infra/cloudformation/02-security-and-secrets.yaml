AWSTemplateFormatVersion: '2010-09-09'
Description: 'Bookworm Platform: KMS Encryption Keys, Secrets Manager with Secret Rotation, and Least-Privilege IAM Roles.'

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: 'Target deployment environment.'

  DatabaseUsername:
    Type: String
    Default: bookworm_admin
    Description: 'Master username for RDS PostgreSQL instance.'

Resources:
  # ----------------------------------------------------------------------------
  # 1. AWS Key Management Service (KMS) Customer Managed Key (CMK)
  # ----------------------------------------------------------------------------
  AppKmsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub 'KMS CMK for Bookworm application encryption (${Environment})'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Id: bookworm-app-key-policy
        Statement:
          - Sid: EnableIamRootPermissions
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: 'kms:*'
            Resource: '*'
          - Sid: AllowSecretsManagerAndCloudWatch
            Effect: Allow
            Principal:
              Service:
                - !Sub 'secretsmanager.${AWS::URLSuffix}'
                - !Sub 'logs.${AWS::Region}.${AWS::URLSuffix}'
                - !Sub 'apprunner.${AWS::URLSuffix}'
            Action:
              - 'kms:Encrypt'
              - 'kms:Decrypt'
              - 'kms:ReEncrypt*'
              - 'kms:GenerateDataKey*'
              - 'kms:DescribeKey'
            Resource: '*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Bookworm

  AppKmsKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/bookworm-${Environment}-app-key'
      TargetKeyId: !Ref AppKmsKey

  # ----------------------------------------------------------------------------
  # 2. AWS Secrets Manager Secret (Database, JWT, and Payment Webhook Secrets)
  # ----------------------------------------------------------------------------
  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub '/bookworm/${Environment}/credentials'
      Description: !Sub 'Production credentials and signing secrets for Bookworm (${Environment})'
      KmsKeyId: !Ref AppKmsKey
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${DatabaseUsername}", "dbname": "bookworm", "port": 5432, "jwt_secret": "PLACEHOLDER_ROTATE_ON_DEPLOY", "payment_webhook_secret": "whsec_prod_key"}'
        GenerateStringKey: 'password'
        PasswordLength: 32
        ExcludeCharacters: '"/@\ '
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Bookworm

  # ----------------------------------------------------------------------------
  # 3. IAM Role: App Runner ECR Access Role (Pulling Images)
  # ----------------------------------------------------------------------------
  AppRunnerECRAccessRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bookworm-${Environment}-apprunner-ecr-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - build.apprunner.amazonaws.com
                - tasks.apprunner.amazonaws.com
            Action: 'sts:AssumeRole'
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AWSAppRunnerServicePolicyForECRAccess'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Bookworm

  # ----------------------------------------------------------------------------
  # 4. IAM Role: App Runner Instance Role (Runtime Least Privilege)
  # ----------------------------------------------------------------------------
  AppRunnerInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'bookworm-${Environment}-apprunner-instance-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: tasks.apprunner.amazonaws.com
            Action: 'sts:AssumeRole'
      Policies:
        - PolicyName: BookwormLeastPrivilegePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # Secrets Manager Access
              - Sid: AllowSecretsAccess
                Effect: Allow
                Action:
                  - 'secretsmanager:GetSecretValue'
                  - 'secretsmanager:DescribeSecret'
                Resource: !Ref AppSecrets
              # KMS Decryption Access
              - Sid: AllowKmsDecrypt
                Effect: Allow
                Action:
                  - 'kms:Decrypt'
                  - 'kms:DescribeKey'
                Resource: !GetAtt AppKmsKey.Arn
              # AWS X-Ray Tracing
              - Sid: AllowXRayTelemetry
                Effect: Allow
                Action:
                  - 'xray:PutTraceSegments'
                  - 'xray:PutTelemetryRecords'
                  - 'xray:GetSamplingRules'
                  - 'xray:GetSamplingTargets'
                Resource: '*'
              # CloudWatch Logs
              - Sid: AllowCloudWatchLogs
                Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                  - 'logs:DescribeLogStreams'
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/apprunner/bookworm-${Environment}*:*'
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: Bookworm

Outputs:
  AppKmsKeyArn:
    Description: 'KMS Key ARN'
    Value: !GetAtt AppKmsKey.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AppKmsKeyArn'

  AppSecretsArn:
    Description: 'Secrets Manager Secret ARN'
    Value: !Ref AppSecrets
    Export:
      Name: !Sub '${AWS::StackName}-AppSecretsArn'

  AppRunnerECRAccessRoleArn:
    Description: 'IAM Role ARN for App Runner ECR Access'
    Value: !GetAtt AppRunnerECRAccessRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AppRunnerECRAccessRoleArn'

  AppRunnerInstanceRoleArn:
    Description: 'IAM Role ARN for App Runner Task Runtime'
    Value: !GetAtt AppRunnerInstanceRole.Arn
    Export:
      Name: !Sub '${AWS::StackName}-AppRunnerInstanceRoleArn'
