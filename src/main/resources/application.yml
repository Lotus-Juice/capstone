server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: bookworm-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/bookworm}
    username: ${SPRING_DATASOURCE_USERNAME:bookworm}
    password: ${SPRING_DATASOURCE_PASSWORD:bookworm_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 25
          order_inserts: true
          order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

# Application Security and JWT Configuration
app:
  jwt:
    secret: ${JWT_SECRET:bookwormEnterpriseSecretKeyMustBeAtLeast256BitsLongForHMACSHA256!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  payment:
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:whsec_bookworm_enterprise_mock_key_2025}

# Springdoc OpenAPI 3.1 & Swagger UI
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    enabled: true

# Actuator & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.bookworm: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
