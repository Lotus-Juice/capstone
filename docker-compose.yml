# ==============================================================================
# Docker Compose: Bookworm Enterprise Backend & PostgreSQL Stack
# Services:
#   - postgres: PostgreSQL 16 Relational Database Engine
#   - flyway-migration: Automated Flyway DDL & Seed Data Migration Runner
#   - bookworm-backend: Spring Boot 3 Java 21 REST API Platform
# ==============================================================================

version: '3.8'

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bookworm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookworm}
      POSTGRES_USER: ${POSTGRES_USER:-bookworm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookworm_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookworm_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bookworm} -d ${POSTGRES_DB:-bookworm}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Standalone Flyway Migration Service (Optional / Fast Bootstrapping)
  # ----------------------------------------------------------------------------
  flyway:
    image: flyway/flyway:10-alpine
    container_name: bookworm-flyway
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    command: -connectRetries=60 -baselineOnMigrate=true migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bookworm}
      FLYWAY_USER: ${POSTGRES_USER:-bookworm}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-bookworm_secret}
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./src/main/resources/db/migration:/flyway/sql:ro
    networks:
      - bookworm_network

  # ----------------------------------------------------------------------------
  # 3. Bookworm Spring Boot 3 Backend Application
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bookworm-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      flyway:
        condition: service_completed_successfully
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-bookworm}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-bookworm}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-bookworm_secret}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "false" # Migrations completed by flyway service
      JWT_SECRET: ${JWT_SECRET:-bookwormEnterpriseSecretKeyMustBeAtLeast256BitsLongForHMACSHA256!}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-whsec_bookworm_enterprise_mock_key_2025}
      SERVER_PORT: 8080
    networks:
      - bookworm_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

# ------------------------------------------------------------------------------
# Persistent Volumes & Network Definitions
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    driver: local

networks:
  bookworm_network:
    driver: bridge
