openapi: 3.1.0
info:
  title: Book Worm E-Bookstore Platform API
  version: 1.0.0
  description: |
    Production-grade RESTful API specification for the **Book Worm** online bookstore.
    Supports guest browsing, identity and session management, catalog navigation, shopping cart,
    order processing, payment orchestration, logistics tracking, customer reviews, promotions, and recommendations.
  contact:
    name: Book Worm API Engineering
    email: api-support@bookworm.example.com
servers:
  - url: https://api.bookworm.example.com/api/v1
    description: Production Server
  - url: https://staging-api.bookworm.example.com/api/v1
    description: Staging Environment
  - url: http://127.0.0.1:8080/api/v1
    description: Local Development Server

tags:
  - name: Authentication
    description: User registration, login, token refresh, and session revocation.
  - name: Users
    description: User profiles and delivery address book management.
  - name: Authors
    description: Author profiles, published works, and "My Writers" subscriptions.
  - name: Publishers
    description: Publisher directories and brand catalogs.
  - name: Categories
    description: Taxonomy hierarchy and category browsing.
  - name: Books
    description: Product catalog, multi-format variants (Paperback, Hardcover, eBook), and details.
  - name: Search
    description: Full-text and multi-faceted search and autocomplete suggestions.
  - name: Wishlist
    description: Customer book wishlists and saved reads.
  - name: Cart
    description: Guest and member shopping carts, item quantities, and cart merging.
  - name: Orders
    description: Checkout pipeline, order state management, order history, and 1-click reorder.
  - name: Payments
    description: Payment gateways (Cards, UPI, Wallets), tokenization, verification, and webhooks.
  - name: Shipping
    description: Pincode serviceability, delivery estimation, and live tracking checkpoints.
  - name: Reviews
    description: Customer star ratings and text reviews (0-500 characters).
  - name: Coupons
    description: Promo code discounts and coupon validation engine.
  - name: Recommendations
    description: Home showcase carousels (Bestsellers, New Launches, Recommended) and related reads.

paths:
  # ==========================================
  # AUTHENTICATION
  # ==========================================
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new customer account
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '409':
          $ref: '#/components/responses/409Conflict'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Authenticate user credentials
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: User authenticated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh expired access token
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke session and refresh token
      operationId: logoutUser
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '204':
          description: Logout successful.
        '401':
          $ref: '#/components/responses/401Unauthorized'

  # ==========================================
  # USERS
  # ==========================================
  /users/profile:
    get:
      tags: [Users]
      summary: Get authenticated user profile
      operationId: getUserProfile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /users/addresses:
    get:
      tags: [Users]
      summary: List all saved delivery addresses
      operationId: getUserAddresses
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of saved addresses.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AddressDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
    post:
      tags: [Users]
      summary: Add a new delivery address
      operationId: addUserAddress
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Address created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /users/addresses/{addressId}:
    delete:
      tags: [Users]
      summary: Delete a saved delivery address
      operationId: deleteUserAddress
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AddressIdPath'
      responses:
        '204':
          description: Address deleted successfully.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  # ==========================================
  # AUTHORS
  # ==========================================
  /authors:
    get:
      tags: [Authors]
      summary: List and search authors
      operationId: listAuthors
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: search
          in: query
          schema:
            type: string
          description: Filter authors by name
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorPageResponse'

  /authors/{authorIdOrSlug}:
    get:
      tags: [Authors]
      summary: Get author details and bibliography
      operationId: getAuthorDetails
      parameters:
        - name: authorIdOrSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorDetailResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

  /authors/{authorId}/follow:
    post:
      tags: [Authors]
      summary: Follow author (Add to "My Writers")
      operationId: followAuthor
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorIdPath'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FollowAuthorResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      tags: [Authors]
      summary: Unfollow author
      operationId: unfollowAuthor
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/AuthorIdPath'
      responses:
        '204':
          description: Author unfollowed.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /authors/followed:
    get:
      tags: [Authors]
      summary: List followed authors ("My Writers")
      operationId: listFollowedAuthors
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FollowedAuthorDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  # ==========================================
  # PUBLISHERS
  # ==========================================
  /publishers:
    get:
      tags: [Publishers]
      summary: List publishers
      operationId: listPublishers
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherPageResponse'

  /publishers/{publisherIdOrSlug}:
    get:
      tags: [Publishers]
      summary: Get publisher details
      operationId: getPublisherDetails
      parameters:
        - name: publisherIdOrSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublisherDTO'
        '404':
          $ref: '#/components/responses/404NotFound'

  # ==========================================
  # CATEGORIES
  # ==========================================
  /categories:
    get:
      tags: [Categories]
      summary: Get full hierarchical category taxonomy tree
      operationId: getCategoryTree
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategoryNodeDTO'

  /categories/{categoryIdOrSlug}:
    get:
      tags: [Categories]
      summary: Get category details
      operationId: getCategoryDetails
      parameters:
        - name: categoryIdOrSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetailResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

  # ==========================================
  # BOOKS
  # ==========================================
  /books:
    get:
      tags: [Books]
      summary: Browse and filter books catalog
      operationId: listBooks
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: Category slug
        - name: language
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            $ref: '#/components/schemas/BookFormatEnum'
        - name: minPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: maxPrice
          in: query
          schema:
            type: number
            minimum: 0
        - name: sortBy
          in: query
          schema:
            type: string
            enum: [relevance, price_asc, price_desc, rating, newest, bestseller]
            default: relevance
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSummaryPageResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /books/{bookIdOrSlug}:
    get:
      tags: [Books]
      summary: Get complete book details page (PDP)
      operationId: getBookDetails
      parameters:
        - name: bookIdOrSlug
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetailResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

  # ==========================================
  # SEARCH
  # ==========================================
  /search:
    get:
      tags: [Search]
      summary: Search books with full-text and multi-faceted filtering
      operationId: searchBooks
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 200
        - name: category
          in: query
          schema:
            type: string
        - name: format
          in: query
          schema:
            $ref: '#/components/schemas/BookFormatEnum'
        - name: language
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /search/suggestions:
    get:
      tags: [Search]
      summary: Autocomplete search suggestions
      operationId: getSearchSuggestions
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 100
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchSuggestionsResponse'

  # ==========================================
  # WISHLIST
  # ==========================================
  /wishlist:
    get:
      tags: [Wishlist]
      summary: Get current user wishlist
      operationId: getWishlist
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /wishlist/items/{bookId}:
    post:
      tags: [Wishlist]
      summary: Add book to wishlist
      operationId: addToWishlist
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WishlistActionResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      tags: [Wishlist]
      summary: Remove book from wishlist
      operationId: removeFromWishlist
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
      responses:
        '204':
          description: Item removed from wishlist.
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  # ==========================================
  # CART
  # ==========================================
  /cart:
    get:
      tags: [Cart]
      summary: Get current active cart
      operationId: getCart
      security:
        - BearerAuth: []
        - GuestSessionHeader: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /cart/items:
    post:
      tags: [Cart]
      summary: Add format variant to cart
      operationId: addCartItem
      security:
        - BearerAuth: []
        - GuestSessionHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartItemRequest'
      responses:
        '200':
          description: Item added, returns updated cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
        '409':
          $ref: '#/components/responses/409Conflict'

  /cart/items/{cartItemId}:
    patch:
      tags: [Cart]
      summary: Update cart item quantity
      operationId: updateCartItemQuantity
      security:
        - BearerAuth: []
        - GuestSessionHeader: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCartItemRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'
    delete:
      tags: [Cart]
      summary: Delete item from cart
      operationId: removeCartItem
      security:
        - BearerAuth: []
        - GuestSessionHeader: []
      parameters:
        - name: cartItemId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '404':
          $ref: '#/components/responses/404NotFound'

  /cart/merge:
    post:
      tags: [Cart]
      summary: Merge anonymous guest cart into authenticated customer account
      operationId: mergeGuestCart
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeCartRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  # ==========================================
  # ORDERS
  # ==========================================
  /orders:
    get:
      tags: [Orders]
      summary: List authenticated customer order history ("My Orders")
      operationId: listOrders
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderHistoryPageResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
    post:
      tags: [Orders]
      summary: Create order from active shopping cart (Checkout)
      operationId: createOrder
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: Order placed in PENDING_PAYMENT state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '409':
          $ref: '#/components/responses/409Conflict'

  /orders/{orderId}:
    get:
      tags: [Orders]
      summary: Get detailed order information
      operationId: getOrderDetails
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetailResponse'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /orders/{orderId}/reorder:
    post:
      tags: [Orders]
      summary: Re-purchase items from past order ("Buy It Again")
      operationId: reorderOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      responses:
        '200':
          description: Items appended to active cart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDTO'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /orders/{orderId}/cancel:
    post:
      tags: [Orders]
      summary: Cancel order before shipment
      operationId: cancelOrder
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CancelOrderRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelOrderResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  # ==========================================
  # PAYMENTS
  # ==========================================
  /payments/initiate:
    post:
      tags: [Payments]
      summary: Initiate payment gateway charge intent
      operationId: initiatePayment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiatePaymentRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiatePaymentResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '404':
          $ref: '#/components/responses/404NotFound'

  /payments/verify:
    post:
      tags: [Payments]
      summary: Verify payment signature and confirm transaction
      operationId: verifyPayment
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPaymentRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyPaymentResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'

  /payments/webhook:
    post:
      tags: [Payments]
      summary: Gateway webhook for asynchronous payment status notification
      operationId: handlePaymentWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook acknowledged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: acknowledged

  # ==========================================
  # SHIPPING
  # ==========================================
  /shipping/estimate:
    get:
      tags: [Shipping]
      summary: Check pincode serviceability and estimated delivery date (EDD)
      operationId: getShippingEstimate
      parameters:
        - name: pincode
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{6}$'
            example: '560001'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShippingEstimateResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /shipping/track/{trackingNumber}:
    get:
      tags: [Shipping]
      summary: Track shipment parcel milestones
      operationId: trackShipment
      parameters:
        - name: trackingNumber
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentTrackingResponse'
        '404':
          $ref: '#/components/responses/404NotFound'

  # ==========================================
  # REVIEWS
  # ==========================================
  /books/{bookId}/reviews:
    get:
      tags: [Reviews]
      summary: Get customer reviews and ratings for a book
      operationId: getBookReviews
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
        - $ref: '#/components/parameters/PageQuery'
        - $ref: '#/components/parameters/SizeQuery'
        - name: rating
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 5
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookReviewsResponse'
        '404':
          $ref: '#/components/responses/404NotFound'
    post:
      tags: [Reviews]
      summary: Submit rating and review (0-500 characters)
      operationId: submitBookReview
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitReviewRequest'
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewDTO'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '409':
          $ref: '#/components/responses/409Conflict'

  # ==========================================
  # COUPONS
  # ==========================================
  /coupons/validate:
    post:
      tags: [Coupons]
      summary: Validate promo coupon against cart value
      operationId: validateCoupon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateCouponRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CouponValidationResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '404':
          $ref: '#/components/responses/404NotFound'

  /coupons/available:
    get:
      tags: [Coupons]
      summary: List active promotional coupons
      operationId: listAvailableCoupons
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CouponOfferDTO'

  # ==========================================
  # RECOMMENDATIONS
  # ==========================================
  /recommendations/home:
    get:
      tags: [Recommendations]
      summary: Get Home Page curated feeds (Recommended, Bestsellers, New Launches)
      operationId: getHomeRecommendations
      security:
        - BearerAuth: []
        - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HomeRecommendationsResponse'

  /recommendations/related/{bookId}:
    get:
      tags: [Recommendations]
      summary: Get related / cross-sell reads for a specific book
      operationId: getRelatedReads
      parameters:
        - $ref: '#/components/parameters/BookIdPath'
        - name: limit
          in: query
          schema:
            type: integer
            default: 3
            maximum: 10
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelatedBookDTO'
        '404':
          $ref: '#/components/responses/404NotFound'

# ============================================================================
# COMPONENTS (REUSABLE SCHEMAS, SECURITY SCHEMES, PARAMETERS & RESPONSES)
# ============================================================================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter standard JWT Bearer token issued during authentication.
    GuestSessionHeader:
      type: apiKey
      in: header
      name: X-Guest-Session-Token
      description: Anonymous session identifier for guest users.

  parameters:
    PageQuery:
      name: page
      in: query
      schema:
        type: integer
        default: 1
        minimum: 1
      description: Page number for pagination
    SizeQuery:
      name: size
      in: query
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
      description: Number of items per page
    BookIdPath:
      name: bookId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AuthorIdPath:
      name: authorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AddressIdPath:
      name: addressId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderIdPath:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    400BadRequest:
      description: Invalid payload or request validation error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    401Unauthorized:
      description: Authentication required or invalid/expired credentials.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    404NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    409Conflict:
      description: Conflict with existing resource state or inventory mismatch.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    # Common Error
    ErrorResponse:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message, timestamp, path]
          properties:
            code:
              type: string
              example: VALIDATION_FAILED
            message:
              type: string
              example: The request payload failed validation.
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
            timestamp:
              type: string
              format: date-time
            path:
              type: string

    # Enums
    BookFormatEnum:
      type: string
      enum: [Paperback, Hardcover, eBook, Audio]

    OrderStatusEnum:
      type: string
      enum: [PENDING_PAYMENT, CONFIRMED, PROCESSING, SHIPPED, DELIVERED, CANCELLED, RETURNED]

    PaymentMethodEnum:
      type: string
      enum: [CREDIT_CARD, DEBIT_CARD, UPI, WALLET]

    # Auth Schemas
    RegisterRequest:
      type: object
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          example: john.smith@example.com
        password:
          type: string
          minLength: 8
          maxLength: 64
          pattern: '^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$'
          example: SecretPass@123
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: John
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: Smith
        phoneNumber:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
          example: '+919876543210'

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: john.smith@example.com
        password:
          type: string
          example: SecretPass@123

    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          example: d701748f-6c54-4b01-90e6-d701748f0851

    AuthTokenResponse:
      type: object
      required: [userId, email, firstName, lastName, role, accessToken, refreshToken, tokenType, expiresIn]
      properties:
        userId:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        role:
          type: string
          example: CUSTOMER
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1Ni...
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          example: 3600

    UserProfileResponse:
      type: object
      required: [id, email, firstName, lastName, role, createdAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        role:
          type: string
        createdAt:
          type: string
          format: date-time

    # Address Schemas
    CreateAddressRequest:
      type: object
      required: [recipientName, recipientPhone, addressLine1, city, state, pincode]
      properties:
        recipientName:
          type: string
          minLength: 1
          maxLength: 200
        recipientPhone:
          type: string
          pattern: '^\+?[1-9]\d{1,14}$'
        addressLine1:
          type: string
          minLength: 1
          maxLength: 255
        addressLine2:
          type: string
        city:
          type: string
          minLength: 1
          maxLength: 100
        state:
          type: string
          minLength: 1
          maxLength: 100
        pincode:
          type: string
          pattern: '^\d{6}$'
          example: '560001'
        country:
          type: string
          default: India
        isDefault:
          type: boolean
          default: false

    AddressDTO:
      type: object
      required: [id, recipientName, recipientPhone, addressLine1, city, state, pincode, country, isDefault]
      properties:
        id:
          type: string
          format: uuid
        recipientName:
          type: string
        recipientPhone:
          type: string
        addressLine1:
          type: string
        addressLine2:
          type: string
        city:
          type: string
        state:
          type: string
        pincode:
          type: string
        country:
          type: string
        isDefault:
          type: boolean

    # Author Schemas
    AuthorDTO:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        biography:
          type: string
        profileImageUrl:
          type: string
        booksCount:
          type: integer
        followersCount:
          type: integer

    AuthorPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/AuthorDTO'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    AuthorDetailResponse:
      type: object
      required: [id, name, slug, isFollowed, books]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        biography:
          type: string
        profileImageUrl:
          type: string
        isFollowed:
          type: boolean
        books:
          type: array
          items:
            $ref: '#/components/schemas/BookSummaryDTO'

    FollowAuthorResponse:
      type: object
      required: [authorId, isFollowed, followedAt]
      properties:
        authorId:
          type: string
          format: uuid
        isFollowed:
          type: boolean
        followedAt:
          type: string
          format: date-time

    FollowedAuthorDTO:
      type: object
      required: [authorId, name, slug]
      properties:
        authorId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        profileImageUrl:
          type: string
        latestRelease:
          type: object
          properties:
            bookId:
              type: string
              format: uuid
            title:
              type: string
            publishedDate:
              type: string
              format: date

    # Publisher Schemas
    PublisherDTO:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        website:
          type: string
        booksCount:
          type: integer

    PublisherPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PublisherDTO'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    # Category Schemas
    CategoryNodeDTO:
      type: object
      required: [id, name, slug]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        subcategories:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNodeDTO'

    CategoryDetailResponse:
      type: object
      required: [id, name, slug, totalBooks]
      properties:
        id:
          type: string
        name:
          type: string
        slug:
          type: string
        description:
          type: string
        parentCategory:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            slug:
              type: string
        totalBooks:
          type: integer

    # Book Schemas
    BookVariantDTO:
      type: object
      required: [variantId, formatType, isbn, sku, listPrice, sellingPrice, inStock]
      properties:
        variantId:
          type: string
          format: uuid
        formatType:
          $ref: '#/components/schemas/BookFormatEnum'
        isbn:
          type: string
          example: '978-3-16-148410-0'
        sku:
          type: string
          example: 'BW-MIN-PB-001'
        listPrice:
          type: number
          example: 299.00
        sellingPrice:
          type: number
          example: 149.00
        currency:
          type: string
          default: INR
        inStock:
          type: boolean
        stockQuantity:
          type: integer
        pageCount:
          type: integer

    BookSummaryDTO:
      type: object
      required: [id, title, slug, coverImageUrl, startingPrice, averageRating]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        author:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
        publisher:
          type: string
        coverImageUrl:
          type: string
        primaryCategory:
          type: string
        averageRating:
          type: number
        ratingsCount:
          type: integer
        availableFormats:
          type: array
          items:
            $ref: '#/components/schemas/BookFormatEnum'
        startingPrice:
          type: number
        currency:
          type: string
          default: INR
        deliveryEstimate:
          type: string
          example: 'Delivery by Mon, 21 Jul'

    BookSummaryPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BookSummaryDTO'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    BookDetailResponse:
      type: object
      required: [id, title, slug, synopsis, coverImageUrl, author, variants]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        subtitle:
          type: string
        slug:
          type: string
        synopsis:
          type: string
        language:
          type: string
        coverImageUrl:
          type: string
        publishedDate:
          type: string
          format: date
        copiesSold:
          type: integer
        averageRating:
          type: number
        ratingsCount:
          type: integer
        isWishlisted:
          type: boolean
        author:
          $ref: '#/components/schemas/AuthorDTO'
        publisher:
          $ref: '#/components/schemas/PublisherDTO'
        categories:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              slug:
                type: string
              isPrimary:
                type: boolean
        variants:
          type: array
          items:
            $ref: '#/components/schemas/BookVariantDTO'

    # Search Schemas
    SearchResultResponse:
      type: object
      required: [content, facets, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BookSummaryDTO'
        facets:
          type: object
          properties:
            categories:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  count:
                    type: integer
            formats:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  count:
                    type: integer
            languages:
              type: array
              items:
                type: object
                properties:
                  name:
                    type: string
                  count:
                    type: integer
            priceRanges:
              type: array
              items:
                type: object
                properties:
                  range:
                    type: string
                  count:
                    type: integer
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    SearchSuggestionsResponse:
      type: object
      required: [suggestions]
      properties:
        suggestions:
          type: array
          items:
            type: object
            required: [type, id, text]
            properties:
              type:
                type: string
                enum: [BOOK, AUTHOR, CATEGORY]
              id:
                type: string
              text:
                type: string

    # Wishlist Schemas
    WishlistItemDTO:
      type: object
      required: [wishlistId, bookId, title, authorName, coverImageUrl, sellingPrice, rating, addedAt]
      properties:
        wishlistId:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        title:
          type: string
        authorName:
          type: string
        coverImageUrl:
          type: string
        sellingPrice:
          type: number
        rating:
          type: number
        addedAt:
          type: string
          format: date-time

    WishlistResponse:
      type: object
      required: [items, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/WishlistItemDTO'
        totalItems:
          type: integer

    WishlistActionResponse:
      type: object
      required: [bookId, inWishlist, message]
      properties:
        bookId:
          type: string
          format: uuid
        inWishlist:
          type: boolean
        message:
          type: string

    # Cart Schemas
    AddCartItemRequest:
      type: object
      required: [variantId, quantity]
      properties:
        variantId:
          type: string
          format: uuid
        quantity:
          type: integer
          minimum: 1
          maximum: 20
          default: 1

    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
          maximum: 20

    MergeCartRequest:
      type: object
      required: [guestSessionToken]
      properties:
        guestSessionToken:
          type: string

    CartItemDTO:
      type: object
      required: [cartItemId, variantId, bookId, title, author, format, coverImageUrl, unitPrice, quantity, lineTotal, inStock]
      properties:
        cartItemId:
          type: string
          format: uuid
        variantId:
          type: string
          format: uuid
        bookId:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        format:
          type: string
        coverImageUrl:
          type: string
        unitPrice:
          type: number
        quantity:
          type: integer
        lineTotal:
          type: number
        inStock:
          type: boolean
        deliveryEstimate:
          type: string

    CartSummaryDTO:
      type: object
      required: [itemsTotal, taxAmount, deliveryCharges, discountAmount, grandTotal, currency]
      properties:
        itemsTotal:
          type: number
        taxAmount:
          type: number
        deliveryCharges:
          type: number
        discountAmount:
          type: number
        couponCode:
          type: string
        grandTotal:
          type: number
        currency:
          type: string
          default: INR

    CartDTO:
      type: object
      required: [cartId, items, itemsCount, summary]
      properties:
        cartId:
          type: string
          format: uuid
        guestSessionToken:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemDTO'
        itemsCount:
          type: integer
        summary:
          $ref: '#/components/schemas/CartSummaryDTO'

    # Order Schemas
    CreateOrderRequest:
      type: object
      required: [cartId, shippingAddressId]
      properties:
        cartId:
          type: string
          format: uuid
        shippingAddressId:
          type: string
          format: uuid
        couponCode:
          type: string

    OrderLineItemDTO:
      type: object
      required: [bookTitle, author, format, unitPrice, quantity, lineTotal]
      properties:
        bookTitle:
          type: string
        author:
          type: string
        format:
          type: string
        unitPrice:
          type: number
        quantity:
          type: integer
        lineTotal:
          type: number

    OrderDetailResponse:
      type: object
      required: [orderId, orderNumber, status, itemsSubtotal, taxAmount, shippingFee, discountAmount, grandTotal, currency, placedAt, lineItems]
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
          example: 'BW-2025-00984'
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        itemsSubtotal:
          type: number
        taxAmount:
          type: number
        shippingFee:
          type: number
        discountAmount:
          type: number
        grandTotal:
          type: number
        currency:
          type: string
          default: INR
        placedAt:
          type: string
          format: date-time
        estimatedDeliveryDate:
          type: string
          format: date
        shippingAddress:
          $ref: '#/components/schemas/AddressDTO'
        lineItems:
          type: array
          items:
            $ref: '#/components/schemas/OrderLineItemDTO'
        payment:
          type: object
          properties:
            paymentMethod:
              $ref: '#/components/schemas/PaymentMethodEnum'
            maskedCard:
              type: string
            status:
              type: string

    OrderHistorySummaryDTO:
      type: object
      required: [orderId, orderNumber, placedAt, status, grandTotal, itemsPreview, canReorder]
      properties:
        orderId:
          type: string
          format: uuid
        orderNumber:
          type: string
        placedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        grandTotal:
          type: number
        itemsPreview:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              coverImageUrl:
                type: string
        canReorder:
          type: boolean

    OrderHistoryPageResponse:
      type: object
      required: [content, page, size, totalElements, totalPages]
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/OrderHistorySummaryDTO'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          maxLength: 255
          example: 'Ordered by mistake'

    CancelOrderResponse:
      type: object
      required: [orderId, status, refundInitiated, refundAmount]
      properties:
        orderId:
          type: string
          format: uuid
        status:
          type: string
          example: CANCELLED
        refundInitiated:
          type: boolean
        refundAmount:
          type: number

    # Payment Schemas
    CardDetailsDTO:
      type: object
      required: [cardNumber, nameOnCard, cvv, expiryMonth, expiryYear]
      properties:
        cardNumber:
          type: string
          pattern: '^\d{13,19}$'
          example: '4111111111114242'
        nameOnCard:
          type: string
          example: 'John Smith'
        cvv:
          type: string
          pattern: '^\d{3,4}$'
          example: '123'
        expiryMonth:
          type: string
          pattern: '^(0[1-9]|1[0-2])$'
          example: '08'
        expiryYear:
          type: string
          pattern: '^\d{4}$'
          example: '2028'

    InitiatePaymentRequest:
      type: object
      required: [orderId, paymentMethod, paymentGateway]
      properties:
        orderId:
          type: string
          format: uuid
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethodEnum'
        paymentGateway:
          type: string
          enum: [RAZORPAY, STRIPE, PAYTM]
          example: RAZORPAY
        cardDetails:
          $ref: '#/components/schemas/CardDetailsDTO'
        upiVpa:
          type: string
          pattern: '^[\w.-]+@[\w.-]+$'
          example: 'user@okhdfcbank'
        walletProvider:
          type: string

    InitiatePaymentResponse:
      type: object
      required: [paymentId, orderId, payableAmount, currency, status]
      properties:
        paymentId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        payableAmount:
          type: number
        currency:
          type: string
          default: INR
        status:
          type: string
          example: PENDING_AUTH
        gatewayTransactionId:
          type: string
        redirectUrl:
          type: string

    VerifyPaymentRequest:
      type: object
      required: [paymentId, gatewayTransactionId, gatewaySignature]
      properties:
        paymentId:
          type: string
          format: uuid
        gatewayTransactionId:
          type: string
        gatewaySignature:
          type: string

    VerifyPaymentResponse:
      type: object
      required: [paymentId, orderId, status, amount, orderStatus, message]
      properties:
        paymentId:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
        status:
          type: string
          example: CAPTURED
        amount:
          type: number
        orderStatus:
          type: string
          example: CONFIRMED
        message:
          type: string
          example: 'Your purchase of the following reads is successful.'

    # Shipping Schemas
    ShippingEstimateResponse:
      type: object
      required: [pincode, isServiceable, estimatedDeliveryDate, displayLabel, shippingFee]
      properties:
        pincode:
          type: string
          example: '560001'
        isServiceable:
          type: boolean
        estimatedDeliveryDate:
          type: string
          format: date
          example: '2025-07-21'
        displayLabel:
          type: string
          example: 'Delivery by Mon, 21 Jul'
        shippingFee:
          type: number
          example: 0.00
        courierPartner:
          type: string
          example: 'BlueDart Express'

    TrackingCheckpointDTO:
      type: object
      required: [checkpointStatus, location, description, scannedAt]
      properties:
        checkpointStatus:
          type: string
          example: IN_TRANSIT
        location:
          type: string
          example: 'Bengaluru Sorting Facility'
        description:
          type: string
          example: 'Processed through sorting facility'
        scannedAt:
          type: string
          format: date-time

    ShipmentTrackingResponse:
      type: object
      required: [trackingNumber, carrierName, status, checkpoints]
      properties:
        trackingNumber:
          type: string
          example: 'BD-9876543210'
        carrierName:
          type: string
          example: 'BlueDart Express'
        status:
          type: string
          example: IN_TRANSIT
        estimatedDeliveryDate:
          type: string
          format: date
        checkpoints:
          type: array
          items:
            $ref: '#/components/schemas/TrackingCheckpointDTO'

    # Review Schemas
    SubmitReviewRequest:
      type: object
      required: [rating]
      properties:
        rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        reviewText:
          type: string
          maxLength: 500
          example: 'The accordion component delivers large amounts of content in a small space through progressive disclosure.'

    ReviewDTO:
      type: object
      required: [reviewId, userName, rating, createdAt]
      properties:
        reviewId:
          type: string
          format: uuid
        userName:
          type: string
          example: 'John Smith'
        rating:
          type: integer
        reviewText:
          type: string
        isVerifiedPurchase:
          type: boolean
        createdAt:
          type: string
          format: date-time

    BookReviewsResponse:
      type: object
      required: [bookId, averageRating, totalReviews, ratingDistribution, content, page, size, totalElements, totalPages]
      properties:
        bookId:
          type: string
          format: uuid
        averageRating:
          type: number
          example: 4.8
        totalReviews:
          type: integer
          example: 545
        ratingDistribution:
          type: object
          properties:
            "5":
              type: integer
            "4":
              type: integer
            "3":
              type: integer
            "2":
              type: integer
            "1":
              type: integer
        content:
          type: array
          items:
            $ref: '#/components/schemas/ReviewDTO'
        page:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer

    # Coupon Schemas
    ValidateCouponRequest:
      type: object
      required: [code, cartAmount]
      properties:
        code:
          type: string
          example: WELCOME100
        cartAmount:
          type: number
          minimum: 0.01
          example: 508.00

    CouponValidationResponse:
      type: object
      required: [couponCode, discountType, discountValue, calculatedDiscount, netPayable, isValid, message]
      properties:
        couponCode:
          type: string
          example: WELCOME100
        discountType:
          type: string
          enum: [FLAT_AMOUNT, PERCENTAGE]
        discountValue:
          type: number
        calculatedDiscount:
          type: number
        netPayable:
          type: number
        isValid:
          type: boolean
        message:
          type: string
          example: 'Coupon applied successfully. You saved ₹100!'

    CouponOfferDTO:
      type: object
      required: [code, description, discountType, discountValue, minOrderAmount, validUntil]
      properties:
        code:
          type: string
        description:
          type: string
        discountType:
          type: string
        discountValue:
          type: number
        minOrderAmount:
          type: number
        validUntil:
          type: string
          format: date-time

    # Recommendation Schemas
    RelatedBookDTO:
      type: object
      required: [id, title, author, format, sellingPrice, coverImageUrl]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          type: string
        format:
          type: string
        sellingPrice:
          type: number
        coverImageUrl:
          type: string

    HomeRecommendationsResponse:
      type: object
      required: [recommendedForYou, bestsellersThisMonth, newLaunches]
      properties:
        recommendedForYou:
          type: array
          items:
            $ref: '#/components/schemas/BookSummaryDTO'
        bestsellersThisMonth:
          type: array
          items:
            $ref: '#/components/schemas/BookSummaryDTO'
        newLaunches:
          type: array
          items:
            $ref: '#/components/schemas/BookSummaryDTO'
